# Host keys are not baked into the image; make them before Ubuntu's
# `sshd -t` check (a drop-in ExecStartPre would run after it), and
# set_identity regenerates them for each new VM. Not `ssh-keygen -A`: it
# would add an RSA key, whose keygen costs a random 0.1-1 s.
[Service]
ExecStartPre=
ExecStartPre=/bin/sh -c '[ -f /etc/ssh/ssh_host_ed25519_key ] || /usr/bin/ssh-keygen -q -t ed25519 -N "" -f /etc/ssh/ssh_host_ed25519_key'
ExecStartPre=/bin/sh -c '[ -f /etc/ssh/ssh_host_ecdsa_key ] || /usr/bin/ssh-keygen -q -t ecdsa -N "" -f /etc/ssh/ssh_host_ecdsa_key'
ExecStartPre=/usr/sbin/sshd -t

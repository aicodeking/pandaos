# Panda launcher: type an app name, press Enter. No launch-count cache, so
# the same text always gives the same first result.
[main]
font=DejaVu Sans:size=13
dpi-aware=no
terminal=foot
prompt="> "
match-mode=exact
cache=/dev/null
width=40
lines=10
icon-theme=Adwaita

[colors]
background=1d2027ff
text=e6e6e6ff
prompt=5ec39aff
input=e6e6e6ff
match=5ec39aff
selection=5ec39aff
selection-text=14161bff
selection-match=14161bff
border=5ec39aff

[border]
width=2
radius=6

# Panda notifications: dark, one accent (#5ec39a), opaque. See man fnott.ini.
# Do not disturb: panda-dnd on|off|toggle (Super+N, panda-menu).
anchor=top-right
max-width=420
dpi-aware=no
selection-helper=fuzzel --dmenu
background=1d2027ff
border-color=5ec39aff
border-size=2
border-radius=6
title-font=DejaVu Sans:size=10
title-color=b0b8c0ff
summary-font=DejaVu Sans:size=11:weight=bold
summary-color=e6e6e6ff
body-font=DejaVu Sans:size=11
body-color=e6e6e6ff
default-timeout=8

[critical]
border-color=e5707aff
default-timeout=0

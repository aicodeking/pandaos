# Panda notifications: dark, one accent (#5ec39a). See man fnott.ini.
anchor=top-right
max-width=420
selection-helper=fuzzel --dmenu
background=1d2027f0
border-color=5ec39aff
border-size=1
border-radius=6
title-font=DejaVu Sans:size=9
title-color=7d8590ff
summary-font=DejaVu Sans:size=10:weight=bold
summary-color=e6e6e6ff
body-font=DejaVu Sans:size=10
body-color=e6e6e6ff
default-timeout=8

[critical]
border-color=e5707aff
default-timeout=0

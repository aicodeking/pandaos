name: compare

# Boots PandaOS headless and stock cloud images of other distros under
# QEMU+KVM with identical resources and measures them (bench/compare/run.py).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions: {}

jobs:
  compare:
    permissions:
      contents: read
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    name: OS comparison (QEMU/KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU, OVMF, cloud-image-utils
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-system-x86 qemu-utils ovmf cloud-image-utils
          ls /usr/share/OVMF/

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            fallback = true
            connect-timeout = 15

      - uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4 # v9
        continue-on-error: true

      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ vars.CACHIX_CACHE || 'pandaos' }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Cache cloud images
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: images
          key: compare-images-${{ hashFiles('bench/compare/images.json') }}

      - name: ssh key for the VMs
        run: ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/vmkey"

      - name: Build the PandaOS headless image
        run: |
          export BENCH_SSH_PUBKEY="$(cat "$RUNNER_TEMP/vmkey.pub")"
          .github/scripts/nix-retry.sh build.log nix build --impure -L --no-update-lock-file -o pandaos-image \
            --expr "import ./bench/compare/pandaos-image.nix { flake = builtins.getFlake \"git+file://$PWD\"; }"
          ls -lL pandaos-image/

      - name: Run the comparison
        run: |
          python3 bench/compare/test_run.py
          python3 bench/compare/run.py --images bench/compare/images.json --key "$RUNNER_TEMP/vmkey" \
            --cache images --out compare-out --pandaos "$(ls pandaos-image/*.qcow2)"

      - name: Summary
        if: always()
        run: cat compare-out/results.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: compare-results
          path: |
            compare-out/results.json
            compare-out/results.md
            compare-out/vm/*/console.log
          if-no-files-found: warn

name: ci

on:
  push:
  pull_request:

permissions: {}

jobs:
  nix-checks:
    permissions:
      contents: read
    uses: ./.github/workflows/nix-checks.yml
    secrets: inherit

  go:
    permissions:
      contents: read
    name: go vet + test (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [agentd, mem, checkpoint, agent-env, sysmcp, computer-use, boat/boatd, boat/api, boat/cli, boat/gateway]
    defaults:
      run:
        working-directory: components/${{ matrix.component }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: components/${{ matrix.component }}/go.mod
          cache: false
      - run: go vet ./...
      - run: go test -race ./...

  boat-sdk:
    permissions:
      contents: read
    name: boat SDKs + guest agent unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 -m unittest discover -s components/boat/sdk/python/tests -v
      - run: cd components/boat/guest/agent && python3 -m unittest -v test_boat_agent
      - run: cd components/boat/sdk/typescript && node --test test/*.test.js
      - run: shellcheck -S warning components/boat/e2e.sh components/boat/boatd/e2e.sh components/boat/guest/build.sh components/boat/guest/test-in-vm.sh components/boat/gateway/e2e-edge.sh components/boat/api/e2e-auth.sh components/boat/sdk/e2e-live.sh components/boat/cli/install.sh

  bench-script:
    permissions:
      contents: read
    name: script self-tests (python, shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 bench/test_collect.py
      - run: python3 tests/test_closures.py
      - run: bash components/agent-clis/test-agents-install.sh
      - run: sh components/desktop/test-agents-status.sh components/desktop/bin/panda-agents-status
      - run: sh components/desktop/test-config.sh
      - run: sh components/desktop/test-dnd.sh
      - run: sh components/desktop/test-cu-busy.sh
      - run: shellcheck components/desktop/bin/* components/desktop/*.sh bench/cubench/os/*.sh
      - run: python3 -m py_compile components/computer-use/*.py

  # The drift checks the manual boatbench workflow ran, on every push: committed reports
  # must regenerate byte for byte from their raw results, and docs/cost.md must carry
  # what `boatbench.py costs` prints today.
  bench-drift:
    permissions:
      contents: read
    name: boatbench unit tests + results/docs drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 bench/boatbench/test_boatbench.py
      - run: python3 bench/boatbench/test_boatdev.py
      - name: results/regen.sh leaves the tree unchanged
        run: |
          sh bench/boatbench/results/regen.sh
          git diff --exit-code
          [ -z "$(git status --porcelain)" ] || { git status --porcelain; exit 1; }
      - name: boatbench.py costs matches docs/cost.md
        run: |
          python3 bench/boatbench/boatbench.py costs >/tmp/costs.md
          python3 - <<'PY'
          doc = open("docs/cost.md").read()
          # Every table and note it prints; its headings are reworded in the doc.
          blocks = [b.strip() for b in open("/tmp/costs.md").read().split("\n\n") if b.strip() and not b.startswith("#")]
          stale = [b for b in blocks if b not in doc]
          for b in stale:
              print("docs/cost.md lacks this `boatbench.py costs` output (paste it in):\n" + b + "\n")
          raise SystemExit(1 if stale or not blocks else 0)
          PY

  cubench:
    permissions:
      contents: read
    name: cubench unit tests + dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 bench/cubench/test_cubench.py
      - name: Dry run (scripted model, fake QMP) over every task and OS profile
        run: |
          os=$(cd bench/cubench/os && for f in *.json; do printf '%s,' "${f%.json}"; done)
          python3 bench/cubench/cubench.py run --dry-run --os "$os" --repeats 1 --out dry
          python3 bench/cubench/cubench.py report dry/results-*.json --out dry/report

  iso:
    permissions:
      contents: read
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    name: build iso-${{ matrix.profile }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [headless, desktop]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Require flake.lock
        run: |
          test -f flake.lock || { echo "::error::flake.lock is missing; run the 'lock' workflow and commit its artifact"; exit 1; }

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            fallback = true
            connect-timeout = 15

      # Best-effort: when the GitHub Actions cache throttles (HTTP 418/429),
      # builds fall back to building locally (fallback = true) and
      # .github/scripts/nix-retry.sh retries; it never fails the job by itself.
      - uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4 # v9
        continue-on-error: true

      # Optional: push to the owner's Cachix cache (see docs/development.md).
      # Skipped when the CACHIX_AUTH_TOKEN secret is unset, e.g. on forks.
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ vars.CACHIX_CACHE || 'pandaos' }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.ref != 'refs/heads/main' }}

      - name: Build ISO
        run: .github/scripts/nix-retry.sh build.log nix build .#iso-${{ matrix.profile }} -L --no-update-lock-file

      - name: ISO size
        run: |
          mkdir -p dist
          find -L result -name '*.iso' -exec cp -L {} dist/ \;
          ls -l dist
          echo "METRIC {\"test\": \"iso-${{ matrix.profile }}\", \"isoMB\": $(( $(stat -c %s dist/*.iso) / 1024 / 1024 ))}"
          du -h dist/*.iso | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pandaos-iso-${{ matrix.profile }}
          path: dist/*.iso
          retention-days: 7
          if-no-files-found: error

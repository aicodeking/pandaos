name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  nix-checks:
    name: nix flake check (VM tests)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: nix flake check
        run: |
          set -o pipefail
          nix flake check -L --keep-going 2>&1 | tee check.log

      - name: Print metrics
        if: always()
        run: |
          grep -h 'METRIC ' check.log || echo "no METRIC lines (checks may have been cached)"
          BENCH_RESULTS_DIR="$RUNNER_TEMP/bench" python3 bench/collect.py check.log \
            | tee -a "$GITHUB_STEP_SUMMARY" || true

  go:
    name: go vet + test (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [agentd, mem]
    defaults:
      run:
        working-directory: components/${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: components/${{ matrix.component }}/go.mod
          cache: false
      - run: go vet ./...
      - run: go test ./...

  bench-script:
    name: bench/collect.py self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 bench/test_collect.py

  iso:
    name: build iso-${{ matrix.profile }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [headless, desktop]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: cachix/install-nix-action@v31

      - uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Build ISO
        run: nix build .#iso-${{ matrix.profile }} -L

      - name: ISO size
        run: |
          mkdir -p dist
          find -L result -name '*.iso' -exec cp -L {} dist/ \;
          ls -l dist
          echo "METRIC {\"test\": \"iso-${{ matrix.profile }}\", \"isoMB\": $(( $(stat -c %s dist/*.iso) / 1024 / 1024 ))}"
          du -h dist/*.iso | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: pandaos-iso-${{ matrix.profile }}
          path: dist/*.iso
          retention-days: 7
          if-no-files-found: error

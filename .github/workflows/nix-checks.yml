name: nix-checks

# `nix flake check`, with a runner per check. One runner building them all was
# shut down mid-build whenever the Nix cache was throttled and it had to compile
# everything. The list comes from the flake, so a new check can't be left out.
on:
  workflow_call:

permissions: {}

jobs:
  plan:
    permissions:
      contents: read
    name: evaluate the flake
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Require flake.lock
        run: |
          test -f flake.lock || { echo "::error::flake.lock is missing; run the 'lock' workflow and commit its artifact"; exit 1; }

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            fallback = true
            connect-timeout = 15

      # Everything `nix flake check` does except building the checks.
      - name: nix flake check --no-build
        run: .github/scripts/nix-retry.sh eval.log nix flake check --no-build --no-update-lock-file

      - name: List the checks
        id: list
        run: |
          set -euo pipefail
          checks=$(nix eval --json --no-update-lock-file .#checks.x86_64-linux --apply builtins.attrNames)
          test "$(jq length <<<"$checks")" -gt 0 || { echo "::error::the flake has no checks"; exit 1; }
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          jq -r '.[]' <<<"$checks" | tee -a "$GITHUB_STEP_SUMMARY"

  check:
    needs: plan
    permissions:
      contents: read
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.plan.outputs.checks) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            fallback = true
            connect-timeout = 15

      # Best-effort: when the GitHub Actions cache throttles (HTTP 418/429),
      # builds fall back to building locally (fallback = true) and
      # .github/scripts/nix-retry.sh retries; it never fails the job by itself.
      - uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4 # v9
        continue-on-error: true

      # Optional: push to the owner's Cachix cache (see docs/development.md).
      # Skipped when the CACHIX_AUTH_TOKEN secret is unset, e.g. on forks.
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ vars.CACHIX_CACHE || 'pandaos' }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

      - name: nix build
        run: .github/scripts/nix-retry.sh check.log nix build ".#checks.x86_64-linux.${{ matrix.check }}" -L --no-link --no-update-lock-file

      - name: Print metrics
        if: always()
        run: |
          grep -h 'METRIC ' check.log || echo "no METRIC lines (checks may have been cached)"
          BENCH_RESULTS_DIR="$RUNNER_TEMP/bench" python3 bench/collect.py check.log \
            | tee -a "$GITHUB_STEP_SUMMARY" || true

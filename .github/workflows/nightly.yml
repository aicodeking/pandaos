name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  bench:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            fallback = true
            connect-timeout = 15

      # Best-effort: when the GitHub Actions cache throttles (HTTP 418/429),
      # builds fall back to building locally (fallback = true) and
      # .github/scripts/nix-retry.sh retries; it never fails the job by itself.
      - uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4 # v9
        continue-on-error: true

      # Build each check separately so one failure doesn't hide the others' metrics.
      # Cached checks print no log, but their result-*/metrics.json still exists.
      - name: Run checks
        id: checks
        run: |
          set -o pipefail
          mkdir -p logs
          status=0
          for c in $(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames | jq -r '.[]'); do
            echo "::group::$c"
            .github/scripts/nix-retry.sh "logs/$c.log" nix build ".#checks.x86_64-linux.$c" -L -o "result-$c" || status=1
            echo "::endgroup::"
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Collect metrics
        if: always()
        run: |
          shopt -s nullglob
          python3 bench/collect.py result-* logs/*.log | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bench-results-${{ github.run_id }}
          path: |
            bench/results/*.json
            logs/
          retention-days: 30

      - name: Fail if any check failed
        if: steps.checks.outputs.status != '0'
        run: exit 1

name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - uses: DeterminateSystems/magic-nix-cache-action@v9

      # Build each check separately so one failure doesn't hide the others' metrics.
      # Cached checks print no log, but their result-*/metrics.json still exists.
      - name: Run checks
        id: checks
        run: |
          set -o pipefail
          mkdir -p logs
          status=0
          for c in $(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames | jq -r '.[]'); do
            echo "::group::$c"
            nix build ".#checks.x86_64-linux.$c" -L -o "result-$c" 2>&1 | tee "logs/$c.log" || status=1
            echo "::endgroup::"
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Collect metrics
        if: always()
        run: |
          shopt -s nullglob
          python3 bench/collect.py result-* logs/*.log | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results-${{ github.run_id }}
          path: |
            bench/results/*.json
            logs/
          retention-days: 30

      - name: Fail if any check failed
        if: steps.checks.outputs.status != '0'
        run: exit 1

name: lock

# Regenerates flake.lock on a runner (Nix is not needed locally) and uploads
# it as an artifact. Fetch it with:
#   gh run download <run-id> -R AICodeKing/pandaos -n flake-lock
on:
  workflow_dispatch:
    inputs:
      update:
        description: "Bump inputs to their latest revisions (nix flake update) instead of only locking missing ones"
        type: boolean
        default: false

permissions: {}

jobs:
  lock:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Lock
        env:
          UPDATE: ${{ inputs.update }}
        run: |
          if [ "$UPDATE" = "true" ]; then nix flake update; else nix flake lock; fi
          nix flake metadata
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flake-lock
          path: flake.lock
          if-no-files-found: error

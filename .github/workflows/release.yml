name: release

# On a v* tag: check, build both ISOs, publish a GitHub release, then move the
# `release` branch to the tag. Installed boxes auto-update from
# github:AICodeKing/pandaos/release, so that branch only moves after all of this passes.
on:
  push:
    tags: ["v*"]

permissions: {}

# One release at a time, so the release branch can't be moved out of order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write # build provenance
      attestations: write
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Require flake.lock
        run: |
          test -f flake.lock || { echo "::error::flake.lock is missing"; exit 1; }

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            fallback = true
            connect-timeout = 15

      # Best-effort: when the GitHub Actions cache throttles (HTTP 418/429),
      # builds fall back to building locally (fallback = true) and
      # .github/scripts/nix-retry.sh retries; it never fails the job by itself.
      - uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4 # v9
        continue-on-error: true

      # Optional: push to the owner's Cachix cache (see docs/development.md).
      # Skipped when the CACHIX_AUTH_TOKEN secret is unset. The ISOs contain the
      # installed systems, so this also caches panda-agentd, panda-mem etc. for boxes.
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ vars.CACHIX_CACHE || 'pandaos' }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}

      - name: nix flake check
        run: .github/scripts/nix-retry.sh check.log nix flake check -L --keep-going --no-update-lock-file

      - name: Build ISOs
        run: |
          set -euo pipefail
          mkdir -p dist
          for p in headless desktop; do
            .github/scripts/nix-retry.sh "build-$p.log" nix build ".#iso-$p" -L --no-update-lock-file -o "result-$p"
            iso=$(find -L "result-$p" -name '*.iso' | head -n 1)
            test -n "$iso"
            cp -L "$iso" "dist/pandaos-${GITHUB_REF_NAME}-$p-x86_64-linux.iso"
          done
          cd dist
          sha256sum -- *.iso > SHA256SUMS
          tee -a "$GITHUB_STEP_SUMMARY" < SHA256SUMS

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*.iso

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and move the release branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Require the tag to be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.iso
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Move the release branch to the tag
        run: git push origin "$GITHUB_SHA:refs/heads/release" --force

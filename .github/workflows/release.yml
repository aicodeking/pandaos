name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  id-token: write # build provenance
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: nix flake check
        run: nix flake check -L --keep-going

      - name: Build ISOs
        run: |
          set -euo pipefail
          mkdir -p dist
          for p in headless desktop; do
            nix build ".#iso-$p" -L -o "result-$p"
            iso=$(find -L "result-$p" -name '*.iso' | head -n 1)
            test -n "$iso"
            cp -L "$iso" "dist/pandaos-${GITHUB_REF_NAME}-$p-x86_64-linux.iso"
          done
          cd dist
          sha256sum -- *.iso > SHA256SUMS
          tee -a "$GITHUB_STEP_SUMMARY" < SHA256SUMS

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.iso

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.iso
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true

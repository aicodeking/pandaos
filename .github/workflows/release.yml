name: release

# On a v* tag: check, build the ISOs, the boat CLI and guest images, publish a GitHub release, then move the
# `release` branch to the tag. Installed boxes auto-update from
# github:AICodeKing/pandaos/release, so that branch only moves after all of this passes.
# Run by hand (workflow_dispatch), it is a dry run: the same checks and builds, the
# assets kept as run artifacts, nothing attested or published and no branch moved.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

# The trusted release-signing key, pinned here rather than read from nixos/modules/release-signers
# in the commit under test. This is defense in depth, not the whole gate: a tag push runs
# release.yml from the tagged commit itself, so whoever can push a v* tag could also edit this
# value. What actually holds the line is the repository's v* tag ruleset (only admins may create,
# update or delete v* tags) plus installed boxes' own update-verify.sh signature check against
# their already-installed release-signers. Keep in sync with nixos/modules/release-signers and SECURITY.md.
env:
  PINNED_SIGNER: 'release@pandaos namespaces="git" ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO8zyQo+fbC0tMzI4gvW6ZICS0p8OVcmeYNGJREXBlNG'

# One release at a time, so the release branch can't be moved out of order.
# Dry runs queue apart: GitHub drops a waiting run when a newer one joins its group.
concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # Fails an unsigned, off-main or non-fast-forward v* tag in seconds, before any ISO or
  # guest image is built or attested. Dry runs (workflow_dispatch) skip it.
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Dry run
        if: github.event_name != 'push'
        run: |
          echo "Dry run ($GITHUB_EVENT_NAME): skipping tag/signature gate"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'push'
        with:
          fetch-depth: 0

      - name: Require the tag to be on main
        if: github.event_name == 'push'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }

      - name: Require signed release commit
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          signers=nixos/modules/release-signers
          grep -Fqx "$PINNED_SIGNER" "$signers" \
            || { echo "::error::$signers does not contain the pinned release signer"; exit 1; }
          tmp=$(mktemp)
          printf '%s\n' "$PINNED_SIGNER" > "$tmp"
          git -c gpg.ssh.allowedSignersFile="$tmp" verify-commit "$GITHUB_SHA" \
            || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) has no valid signature from the pinned release signer"; exit 1; }
          status=$(git -c gpg.ssh.allowedSignersFile="$tmp" log -1 --format=%G? "$GITHUB_SHA")
          test "$status" = G \
            || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) signature status is '$status', want G"; exit 1; }

      - name: Require a fast-forward of the release branch
        if: github.event_name == 'push'
        run: |
          if git ls-remote --exit-code --heads origin release >/dev/null; then
            git fetch origin release
            git merge-base --is-ancestor FETCH_HEAD "$GITHUB_SHA" \
              || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) would rewind or diverge from origin/release"; exit 1; }
          fi

  # Gated on verify-tag so an unsigned or off-main v* tag fails before fanning out the
  # check matrix or pushing anything to Cachix.
  checks:
    needs: [verify-tag]
    permissions:
      contents: read
    uses: ./.github/workflows/nix-checks.yml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  unit-checks:
    needs: [verify-tag]
    permissions:
      contents: read
    uses: ./.github/workflows/unit-checks.yml

  build:
    needs: [verify-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write # build provenance
      attestations: write
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Require flake.lock
        run: |
          test -f flake.lock || { echo "::error::flake.lock is missing"; exit 1; }

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            fallback = true
            connect-timeout = 15

      # Best-effort: when the GitHub Actions cache throttles (HTTP 418/429),
      # builds fall back to building locally (fallback = true) and
      # .github/scripts/nix-retry.sh retries; it never fails the job by itself.
      - uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4 # v9
        continue-on-error: true

      # Optional: push to the owner's Cachix cache (see docs/development.md).
      # Skipped when the CACHIX_AUTH_TOKEN secret is unset. The ISOs contain the
      # installed systems, so this also caches panda-agentd, panda-mem etc. for boxes.
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ vars.CACHIX_CACHE || 'pandaos' }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}

      - name: Build ISOs
        run: |
          set -euo pipefail
          mkdir -p dist
          for p in headless desktop server; do
            .github/scripts/nix-retry.sh "build-$p.log" nix build ".#iso-$p" -L --no-update-lock-file -o "result-$p"
            iso=$(find -L "result-$p" -name '*.iso' | head -n 1)
            test -n "$iso"
            cp -L "$iso" "dist/pandaos-${GITHUB_REF_NAME}-$p-x86_64-linux.iso"
          done
          for f in dist/*.iso; do
            size=$(stat -c %s "$f")
            test "$size" -lt 2147483648 || { echo "::error::$f ($size bytes) is over GitHub's 2 GiB asset limit"; exit 1; }
          done
          cd dist
          sha256sum -- *.iso > SHA256SUMS
          tee -a "$GITHUB_STEP_SUMMARY" < SHA256SUMS

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        if: github.event_name == 'push'
        with:
          subject-path: |
            dist/*.iso
            dist/SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  boat-assets:
    needs: [verify-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write # build provenance
      attestations: write
    env:
      OUT: /mnt/guest-out
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: components/boat/cli/go.mod
          cache: false

      # boat_<os>_<arch>[.exe] + boat_SHA256SUMS: what cli/install.sh and `boat upgrade` fetch.
      - name: Build the boat CLI
        run: |
          set -euo pipefail
          mkdir -p dist
          for os in linux darwin windows; do
            ext=""
            [ "$os" = windows ] && ext=.exe
            for arch in amd64 arm64; do
              (cd components/boat/cli && CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o "$GITHUB_WORKSPACE/dist/boat_${os}_${arch}${ext}" .)
            done
          done
          (cd dist && sha256sum boat_* > boat_SHA256SUMS)

      - name: Free disk space, docker on /mnt
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo systemctl stop docker docker.socket
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          sudo mkdir -p "$OUT" && sudo chown "$(id -u):$(id -g)" "$OUT"

      # Same key and paths as boat-e2e.yml's Firecracker e2e job, which saves this cache.
      # Only for workflow_dispatch dry runs: a real tag release never attests a guest image
      # restored from another workflow's cache; it always rebuilds every guest image (incl.
      # boat-guest-rootfs-full) cleanly in this isolated job. With the step skipped, $OUT is
      # empty, so the next step takes its `build.sh all` branch.
      - name: Restore guest image
        if: github.event_name != 'push'
        id: guest
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            /mnt/guest-out/vmlinux
            /mnt/guest-out/rootfs-slim.ext4.zst
            /mnt/guest-out/rootfs-full.ext4.zst
            /mnt/guest-out/size-*.txt
            /mnt/guest-out/manifest-*.txt
          key: boat-guest-full-${{ hashFiles('components/boat/guest/Dockerfile', 'components/boat/guest/build.sh', 'components/boat/guest/kernel/**', 'components/boat/guest/rootfs/**', 'components/boat/guest/rootfs-full/**', 'components/boat/guest/agent/boat*.py', 'components/boat/guest/ssh-authorize.py', 'components/boat/cli/**') }}

      # For services.boat.images (docs/boat.md). GitHub refuses release assets over 2 GiB,
      # so the full image ships as deterministic 1500 MiB parts:
      #   cat boat-guest-rootfs-full.ext4.zst.part* > boat-guest-rootfs-full.ext4.zst
      # boat_guest_SHA256SUMS lists every part plus the reassembled image.
      - name: Build the guest images
        run: |
          set -euo pipefail
          limit=2147483648
          if [ -f "$OUT/vmlinux" ] && [ -f "$OUT/rootfs-slim.ext4.zst" ] && [ -f "$OUT/rootfs-full.ext4.zst" ]; then
            echo "guest images restored from cache"
          elif [ ! -f "$OUT/vmlinux" ] && [ ! -f "$OUT/rootfs-slim.ext4.zst" ] && [ ! -f "$OUT/rootfs-full.ext4.zst" ]; then
            components/boat/guest/build.sh all
          else
            [ -f "$OUT/vmlinux" ] || components/boat/guest/build.sh kernel
            [ -f "$OUT/rootfs-slim.ext4.zst" ] || components/boat/guest/build.sh rootfs slim
            [ -f "$OUT/rootfs-full.ext4.zst" ] || components/boat/guest/build.sh rootfs full
          fi
          ls -l "$OUT"
          cp "$OUT/vmlinux" dist/boat-guest-vmlinux
          cp "$OUT/rootfs-slim.ext4.zst" dist/boat-guest-rootfs-slim.ext4.zst
          rm -f dist/boat-guest-rootfs-full.ext4.zst*
          split -b 1500M -d -a 2 "$OUT/rootfs-full.ext4.zst" dist/boat-guest-rootfs-full.ext4.zst.part
          compgen -G 'dist/boat-guest-rootfs-full.ext4.zst.part*' >/dev/null \
            || { echo "::error::splitting rootfs-full produced no parts"; exit 1; }
          full_sha=$(sha256sum "$OUT/rootfs-full.ext4.zst" | awk '{print $1}')
          parts_sha=$(cat dist/boat-guest-rootfs-full.ext4.zst.part* | sha256sum | awk '{print $1}')
          test "$parts_sha" = "$full_sha" \
            || { echo "::error::reassembled rootfs-full parts ($parts_sha) != rootfs-full.ext4.zst ($full_sha)"; exit 1; }
          for f in dist/boat-guest-* dist/boat_*; do
            size=$(stat -c %s "$f")
            test "$size" -lt "$limit" || { echo "::error::$f ($size bytes) is over GitHub's 2 GiB asset limit"; exit 1; }
          done
          (cd dist && sha256sum boat-guest-* > boat_guest_SHA256SUMS)
          printf '%s  boat-guest-rootfs-full.ext4.zst\n' "$full_sha" >> dist/boat_guest_SHA256SUMS
          test "$(stat -c %s dist/boat_guest_SHA256SUMS)" -lt "$limit"
          ls -l dist/
          tee -a "$GITHUB_STEP_SUMMARY" < dist/boat_SHA256SUMS
          tee -a "$GITHUB_STEP_SUMMARY" < dist/boat_guest_SHA256SUMS

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        if: github.event_name == 'push'
        with:
          subject-path: |
            dist/boat_*_*
            dist/boat_SHA256SUMS
            dist/boat-guest-*
            dist/boat_guest_SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: boat-assets
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [verify-tag, checks, unit-checks, build, boat-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and move the release branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Require the tag to be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }

      # Defense in depth (verify-tag already ran this): only commits signed by the pinned
      # key may be released (git verifies SSH signatures with the runner's ssh-keygen -Y verify).
      - name: Require signed release commit
        run: |
          set -euo pipefail
          signers=nixos/modules/release-signers
          grep -Fqx "$PINNED_SIGNER" "$signers" \
            || { echo "::error::$signers does not contain the pinned release signer"; exit 1; }
          tmp=$(mktemp)
          printf '%s\n' "$PINNED_SIGNER" > "$tmp"
          git -c gpg.ssh.allowedSignersFile="$tmp" verify-commit "$GITHUB_SHA" \
            || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) has no valid signature from the pinned release signer"; exit 1; }
          status=$(git -c gpg.ssh.allowedSignersFile="$tmp" log -1 --format=%G? "$GITHUB_SHA")
          test "$status" = G \
            || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) signature status is '$status', want G"; exit 1; }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: boat-assets
          path: dist

      # The tag's CHANGELOG.md section (`## [X.Y.Z]` up to the next `## `) heads the release
      # notes; GitHub's generated notes are appended below it. Empty if there is no section.
      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          mkdir -p dist
          awk -v ver="${GITHUB_REF_NAME#v}" '
            /^## / {
              if (found) exit
              h = $0; sub(/^## +/, "", h); sub(/^\[/, "", h)
              c = substr(h, length(ver) + 1, 1)
              if (index(h, ver) == 1 && (c == "" || c == "]" || c == " ")) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > dist/RELEASE_NOTES.md || : > dist/RELEASE_NOTES.md
          if [ -s dist/RELEASE_NOTES.md ]; then
            echo "release notes: $(wc -l < dist/RELEASE_NOTES.md) lines from CHANGELOG.md"
          else
            echo "::warning::no CHANGELOG.md section for ${GITHUB_REF_NAME#v}; using generated notes only"
          fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.iso
            dist/SHA256SUMS
            dist/boat_*
            dist/boat-guest-*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Move the release branch to the tag
        run: |
          if git ls-remote --exit-code --heads origin release >/dev/null; then
            git fetch origin release
            git merge-base --is-ancestor FETCH_HEAD "$GITHUB_SHA" \
              || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) would rewind or diverge from origin/release"; exit 1; }
            git push origin "$GITHUB_SHA:refs/heads/release"
          else
            git push origin "$GITHUB_SHA:refs/heads/release"
          fi

name: boat-e2e

# Real Firecracker end-to-end test of boat on a KVM-capable ubuntu runner:
# guest image (cached) -> boatd + boat-api + boat-gateway built from source
# and run as plain processes -> every feature driven through the `boat` CLI
# (components/boat/e2e.sh). Then the edge (components/boat/gateway/e2e-edge.sh):
# real Caddy with its internal CA + the ssh jump host on 2222 in front of a
# fresh stack: private/public port routes, per-VM desktop origins, ssh -J,
# plus guest/desktop-check.sh, sdk/e2e-live.sh and api/e2e-auth.sh.

on:
  push:
    paths:
      - components/boat/**
      - flake.nix
      - nixos/profiles/server.nix
      - nixos/installer/**
      - nixos/modules/iso.nix
      - tests/boat-*.nix
      - tests/standalone.nix
      - .github/workflows/boat-e2e.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: boat-e2e-${{ github.ref }}
  # Several people push to main: let a running e2e finish so it gives a real
  # result. GitHub keeps only the newest waiting run per group.
  cancel-in-progress: false

# No magic-nix-cache here. GitHub throttles it (HTTP 418) on most runs. When that
# hits while nix is fetching paths only it holds, nix can go silent until the job
# times out (run 41492186307, attempts 2 and 4). cache.nixos.org plus local builds
# took about as long when the cache was disabled from the start (attempt 3).
jobs:
  # Heavy NixOS tests with a runner each, not in the shared `nix flake check`.
  vm-tests:
    permissions:
      contents: read
    name: ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        test: [boat-install, boat-ops]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            fallback = true
            connect-timeout = 15
      - name: nix build ${{ matrix.test }}
        run: .github/scripts/nix-retry.sh build.log nix build --impure -f tests/standalone.nix ${{ matrix.test }} -L --no-link

  # A real VM under the real NixOS module, through switch, boatd restart, reboot.
  # Not `needs: e2e`: a job waiting on another was cancelled when a newer run queued.
  real-vm:
    permissions:
      contents: read
    name: boat-real
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OUT: /mnt/guest-out
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo systemctl stop docker docker.socket
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          sudo mkdir -p /mnt/guest-out /mnt/guest-test && sudo chown "$(id -u):$(id -g)" /mnt/guest-out /mnt/guest-test
          df -h / /mnt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore guest image
        id: guest
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            /mnt/guest-out/vmlinux
            /mnt/guest-out/rootfs-slim.ext4.zst
            /mnt/guest-out/rootfs-full.ext4.zst
            /mnt/guest-out/size-*.txt
            /mnt/guest-out/manifest-*.txt
          key: boat-guest-${{ hashFiles('components/boat/guest/Dockerfile', 'components/boat/guest/build.sh', 'components/boat/guest/kernel/**', 'components/boat/guest/rootfs/**', 'components/boat/guest/rootfs-full/**', 'components/boat/guest/agent/boat*.py', 'components/boat/cli/**') }}
      - name: Build the slim guest image (no cache yet for this source)
        if: steps.guest.outputs.cache-hit != 'true'
        run: |
          components/boat/guest/build.sh kernel
          components/boat/guest/build.sh rootfs slim
      - name: Unpack guest image
        run: |
          cp /mnt/guest-out/vmlinux /mnt/guest-test/vmlinux
          zstd -q -d -f /mnt/guest-out/rootfs-slim.ext4.zst -o /mnt/guest-test/rootfs-slim.ext4
          ls -l /mnt/guest-test
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            fallback = true
            connect-timeout = 15
      - name: nix build boat-real
        run: .github/scripts/nix-retry.sh build.log nix build --impure -f tests/standalone.nix boat-real --argstr guestDir /mnt/guest-test -L --no-link

  # The server profile's boatd, as a systemd-nspawn container of the NixOS
  # configuration on this runner, creates real guests from the real image on
  # the runner's /dev/kvm: exec, stop/resume, fork, snapshot, a boatd restart
  # with VMs running, delete (tests/boat-real.nix says what it does not prove).
  # The driver runs as root outside the Nix sandbox: the jailer mknods devices.
  real-guest:
    permissions:
      contents: read
    name: boat-real guest (server profile in nspawn)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OUT: /mnt/guest-out
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo systemctl stop docker docker.socket
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          sudo mkdir -p /mnt/guest-out /mnt/guest-test && sudo chown "$(id -u):$(id -g)" /mnt/guest-out /mnt/guest-test
          df -h / /mnt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore guest image
        id: guest
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            /mnt/guest-out/vmlinux
            /mnt/guest-out/rootfs-slim.ext4.zst
            /mnt/guest-out/rootfs-full.ext4.zst
            /mnt/guest-out/size-*.txt
            /mnt/guest-out/manifest-*.txt
          key: boat-guest-${{ hashFiles('components/boat/guest/Dockerfile', 'components/boat/guest/build.sh', 'components/boat/guest/kernel/**', 'components/boat/guest/rootfs/**', 'components/boat/guest/rootfs-full/**', 'components/boat/guest/agent/boat*.py', 'components/boat/cli/**') }}
      - name: Build the slim guest image (no cache yet for this source)
        if: steps.guest.outputs.cache-hit != 'true'
        run: |
          components/boat/guest/build.sh kernel
          components/boat/guest/build.sh rootfs slim
      - name: Unpack guest image
        run: |
          cp /mnt/guest-out/vmlinux /mnt/guest-test/vmlinux
          zstd -q -d -f /mnt/guest-out/rootfs-slim.ext4.zst -o /mnt/guest-test/rootfs-slim.ext4
          ls -l /mnt/guest-test
      # /var/lib/boat on btrfs, as on a server (reflink fork/snapshot, subvolumes).
      - name: btrfs for /var/lib/boat
        run: |
          command -v mkfs.btrfs >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq btrfs-progs; }
          sudo truncate -s 30G /mnt/boat-real-data.img
          sudo mkfs.btrfs -q /mnt/boat-real-data.img
          sudo mkdir -p /mnt/boat-real-data /mnt/boat-real-tmp
          sudo mount -o loop,compress=zstd:1,noatime /mnt/boat-real-data.img /mnt/boat-real-data
          findmnt /mnt/boat-real-data
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            fallback = true
            connect-timeout = 15
      - name: nix build the boat-real guest test driver
        run: .github/scripts/nix-retry.sh build.log nix build --impure -f tests/standalone.nix boat-real.guest.driver --argstr guestDir /mnt/guest-test -L -o guest-driver
      - name: boat-real guest
        timeout-minutes: 60
        # The driver puts the container's root under XDG_RUNTIME_DIR first: on disk, not
        # tmpfs (systemd-creds refuses a host key on tmpfs, so boat-secrets would fail).
        run: sudo env XDG_RUNTIME_DIR=/mnt/boat-real-tmp TMPDIR=/mnt/boat-real-tmp ./guest-driver/bin/nixos-test-driver -o /mnt/boat-real-tmp 2>&1 | tee guest.log; test "${PIPESTATUS[0]}" = 0
      - name: Metrics
        if: always()
        run: grep -h '^METRIC ' guest.log | tee -a "$GITHUB_STEP_SUMMARY" || echo "no METRIC line"

  # The ISO that ships the server profile: ci.yml builds the other two.
  iso-server:
    permissions:
      contents: read
    name: build iso-server
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            fallback = true
            connect-timeout = 15
      # A cold build takes ~10 min. Fail a hang here instead of at the job's 120 min.
      - name: Build ISO
        timeout-minutes: 60
        run: .github/scripts/nix-retry.sh build.log nix build .#iso-server -L --no-update-lock-file
      - name: ISO size
        run: du -hL result/iso/*.iso | tee -a "$GITHUB_STEP_SUMMARY"

  e2e:
    permissions:
      contents: read
    name: boat e2e (Firecracker on KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OUT: /mnt/guest-out
      E2E_WORK: /mnt/boat-e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free disk space, docker on /mnt
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo systemctl stop docker docker.socket
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          sudo mkdir -p "$OUT" "$E2E_WORK" && sudo chown "$(id -u):$(id -g)" "$OUT" "$E2E_WORK"
          df -h / /mnt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Restore guest image
        id: guest
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            /mnt/guest-out/vmlinux
            /mnt/guest-out/rootfs-slim.ext4.zst
            /mnt/guest-out/rootfs-full.ext4.zst
            /mnt/guest-out/size-*.txt
            /mnt/guest-out/manifest-*.txt
          key: boat-guest-${{ hashFiles('components/boat/guest/Dockerfile', 'components/boat/guest/build.sh', 'components/boat/guest/kernel/**', 'components/boat/guest/rootfs/**', 'components/boat/guest/rootfs-full/**', 'components/boat/guest/agent/boat*.py', 'components/boat/cli/**') }}

      - name: Build guest image (kernel + slim + full)
        if: steps.guest.outputs.cache-hit != 'true'
        run: |
          components/boat/guest/build.sh all
          ls -l "$OUT"

      - name: Save guest image
        if: steps.guest.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            /mnt/guest-out/vmlinux
            /mnt/guest-out/rootfs-slim.ext4.zst
            /mnt/guest-out/rootfs-full.ext4.zst
            /mnt/guest-out/size-*.txt
            /mnt/guest-out/manifest-*.txt
          key: ${{ steps.guest.outputs.cache-primary-key }}

      - name: Unpack guest image
        run: |
          for v in slim full; do
            [ -f "$OUT/rootfs-$v.ext4" ] || zstd -q -d -f "$OUT/rootfs-$v.ext4.zst"
          done
          ls -l "$OUT"
          cat "$OUT"/size-*.txt "$OUT"/manifest-*.txt
          # The images are dense now; the build's docker layers are not needed.
          docker system prune -af >/dev/null || true
          df -h / /mnt

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: components/boat/boatd/go.mod
          cache: false

      # dashboard/e2e.sh drives a real browser with Node 22's built-in WebSocket.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: e2e
        run: components/boat/e2e.sh "$OUT" 2>&1 | tee e2e.log; test "${PIPESTATUS[0]}" = 0

      - name: guest checks in a VM (test-in-vm.sh)
        if: ${{ !cancelled() }} # independent of e2e: every run reports all three
        run: sudo -E components/boat/guest/test-in-vm.sh "$OUT/vmlinux" "$OUT/rootfs-full.ext4" 2>&1 | tee -a e2e.log; test "${PIPESTATUS[0]}" = 0

      - name: e2e edge (Caddy TLS, private routes, desktop origins, ssh jump)
        if: ${{ !cancelled() }}
        env:
          E2E_WORK: /mnt/boat-edge
          # Optional: without them sdk/e2e-agent-from-env.sh prints SKIPPED, not a pass.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: components/boat/gateway/e2e-edge.sh "$OUT" 2>&1 | tee -a e2e.log; test "${PIPESTATUS[0]}" = 0

      - name: Metrics
        if: always()
        run: |
          grep -h '^METRIC ' e2e.log | tee -a "$GITHUB_STEP_SUMMARY" || echo "no METRIC line"

<!doctype html><html><head><meta charset=utf-8><title>Sign up</title><style>body{font:16px sans-serif;margin:2em;max-width:44em}label{display:block;margin:.8em 0}input,select,button{font:inherit}</style></head><body><h1>Sign up</h1>
